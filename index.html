<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Summary Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            margin-top: 50px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Sales Summary</h1>
        <h2>Total Sales: <span id="total-sales">Calculating...</span></h2>
    </div>
    
    <div class="container">
        <table class="table" id="product-sales">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Sales</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        fetch('data.csv')
            .then(response => response.text())
            .then(data => {
                const lines = data.trim().split('\n');
                let total = 0;
                let tableContent = '';
                for (let i = 0; i < lines.length; i++) {
                    const cols = lines[i].split(',').map(c => c.trim());
                    if (cols.length >= 2) {
                        const name = cols[0];
                        const val = parseFloat(cols[1]);
                        if (!isNaN(val)) {
                            total += val;
                            tableContent += `<tr><td>${name}</td><td>${val.toFixed(2)}</td></tr>`;
                        }
                    }
                }
                if (!isNaN(total)) {
                    document.querySelector('#total-sales').textContent = total.toFixed(2);
                    document.querySelector('#product-sales tbody').innerHTML = tableContent;
                }
            });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
